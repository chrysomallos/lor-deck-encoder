name: Node.js CI

on: [push]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      pull-requests: write # CTRF posts/overwrites the PR comment

    steps:
      - uses: actions/checkout@v7

      - name: Set Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.x

      - name: Enable corepack
        shell: bash
        run: corepack enable

      - name: Run install
        uses: borales/actions-yarn@v5
        with:
          cmd: install --immutable

      - name: Run unit tests
        uses: borales/actions-yarn@v5
        with:
          cmd: test:ci

      - name: Publish test report
        uses: ctrf-io/github-test-reporter@v1
        with:
          report-path: 'ctrf/*.json'
          summary: true
          pull-request-report: ${{ github.event_name == 'pull_request' }}
          overwrite-comment: ${{ github.event_name == 'pull_request' }}
          comment-tag: test-results
          flaky-report: true
          use-suite-name: true
          group-by: suite
          slowest-report: true
          previous-results-report: true
          upload-artifact: true       
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: always()
